<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Test | Uday Singh</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="styles/knowura.css">
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="square"><rect x="2.5" y="4.5" width="19" height="15"/><path d="M3 6l9 7 9-7"/></g></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/></g><circle cx="17.6" cy="6.4" r="1.4" fill="currentColor"/></symbol>
  </svg>

  <!-- big name sits UNDER the 3D canvas so the laptop floats in front of it -->
  <div class="name-bg">
    <h1 class="name-stack" aria-label="Uday Singh">
      <span class="tag tag-uday" aria-hidden="true">UDAY</span>
      <span class="tag tag-singh" aria-hidden="true">SINGH</span>
      <span class="sticker st-gh" aria-hidden="true"><svg class="icon"><use href="#i-github"/></svg></span>
      <span class="sticker st-mail" aria-hidden="true"><svg class="icon"><use href="#i-mail"/></svg></span>
      <span class="sticker st-ig" aria-hidden="true"><svg class="icon"><use href="#i-insta"/></svg></span>
    </h1>
  </div>

  <!-- fixed 3D stage sits behind all content -->
  <div class="laptop-stage" id="stage" aria-hidden="true">
    <canvas id="laptop-canvas"></canvas>
    <svg class="laptop-fallback" viewBox="0 0 240 160" fill="none" stroke="#22e5ff" stroke-width="3">
      <rect x="40" y="12" width="160" height="104" rx="8" fill="#050a1a"/>
      <path d="M16 124h208l-14 20H30z" fill="#0f2a80"/>
      <path d="M60 40l14 12-14 12M84 64h30" stroke-linecap="square"/>
    </svg>
  </div>

  <main>
    <section class="hero" id="hero">
      <div class="hero-copy">
        <p class="eyebrow glass-light">Vadodara, India</p>
        <p class="tagline">I build hardware that talks to software</p>
        <div class="actions">
          <a class="btn" href="https://github.com/udaydotoffical-svg" target="_blank" rel="noopener"><svg class="icon"><use href="#i-github"/></svg>GitHub</a>
          <a class="btn" href="mailto:uday.dot.offical@gmail.com"><svg class="icon"><use href="#i-mail"/></svg>Email</a>
          <a class="btn" href="https://instagram.com/uday.dot.official" target="_blank" rel="noopener"><svg class="icon"><use href="#i-insta"/></svg>Instagram</a>
        </div>
      </div>
    </section>

    <!-- stand-in for About, to show the shrink-and-drift on scroll -->
    <section class="hero" id="about" style="min-height:90vh;align-items:center">
      <div class="glass" style="padding:32px;max-width:560px">
        <h2 style="margin-top:0;font-weight:400">About (placeholder)</h2>
        <p>Scroll check: the laptop should shrink and drift to the side while this panel scrolls in.</p>
      </div>
    </section>
    <div style="height:60vh"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="js/laptop.js"></script>
  <script>
    LaptopHero.init({
      canvas: document.getElementById('laptop-canvas'),
      stage: document.getElementById('stage'),
      track: document.getElementById('hero'),
      zone: [document.getElementById('hero'), document.getElementById('about')],
      // glbUrl: 'models/laptop.glb',
    });
  </script>
</body>
</html>

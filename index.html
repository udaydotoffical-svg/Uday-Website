<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uday Singh | Firmware &amp; Hardware Developer</title>
  <meta name="description" content="Uday Singh is a student developer and hardware builder from Vadodara, India, focused on firmware and hardware. WRO 2026 Future Innovators, team CultureWear.">
  <meta name="theme-color" content="#05070f">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Uday Singh | I build hardware that talks to software">
  <meta property="og:description" content="Student developer from Vadodara, India. Firmware, Knowura, and the Samata headband (firmware).">
  <meta property="og:url" content="https://uday3ebsite.vercel.app/">
  <meta property="og:image" content="https://uday3ebsite.vercel.app/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/fontsource/fonts/geist-pixel@5.3.0/latin-400-normal.woff2">

  <!-- design system first, then site styles -->
  <link rel="stylesheet" href="styles/knowura.css">
  <link rel="stylesheet" href="styles/site.css">
  <link rel="preload" as="image" href="assets/ocean-bg.jpg" fetchpriority="low">
  <link rel="stylesheet" href="styles/fx.css">
  <script>
    // boot loader once per session (skipped for reduced motion); failsafes if JS below never runs
    (function (d) {
      d.classList.add('js');
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('uday-booted')) d.classList.add('is-loading');
      } catch (e) {}
      setTimeout(function () { d.classList.remove('is-loading'); d.classList.add('is-intro'); }, 5000);
    })(document.documentElement);
  </script>
</head>
<body>
  <div class="ocean" id="ocean" aria-hidden="true"><i></i><i></i></div>

  <div class="loader" id="loader" aria-hidden="true">
    <ul class="loader-log">
      <li>booting uday.os</li>
      <li>flashing firmware</li>
      <li>waking sensors</li>
      <li>linking hardware to software</li>
    </ul>
    <div>
      <div class="loader-num">000</div>
      <div class="loader-bar"><i></i></div>
    </div>
  </div>

  <a class="skip" href="#about">Skip to content</a>

  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="square"><rect x="2.5" y="4.5" width="19" height="15"/><path d="M3 6l9 7 9-7"/></g></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/></g><circle cx="17.6" cy="6.4" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0C12 7 17 12 24 12 17 12 12 17 12 24 12 17 7 12 0 12 7 12 12 7 12 0Z"/></symbol>
  </svg>

  <header class="nav">
    <nav class="nav-links" id="nav-links" aria-label="Sections"></nav>
    <button class="btn nav-cmd" id="open-palette" type="button" aria-label="Open command palette">/</button>
  </header>

  <!-- big name sits UNDER the 3D canvas so the laptop floats in front of it -->
  <div class="name-bg" id="top">
    <h1 class="name-stack" aria-label="Uday Singh">
      <span class="tag tag-uday" aria-hidden="true">UDAY</span>
      <span class="tag tag-singh" aria-hidden="true">SINGH</span>
      <svg class="star" style="--dx:2.6;--dy:-3.1;--mx:2.5;--my:-3.1;--s:.85;--t:0s"><use href="#i-star"/></svg>
      <svg class="star" style="--dx:-4.7;--dy:-1.7;--mx:-2.7;--my:-2.5;--s:.55;--t:.7s"><use href="#i-star"/></svg>
      <svg class="star alt" style="--dx:-1.9;--dy:-3.0;--mx:.4;--my:-3.4;--s:.35;--t:1.3s"><use href="#i-star"/></svg>
      <svg class="star" style="--dx:2.3;--dy:2.7;--mx:2.5;--my:3;--s:.6;--t:.4s"><use href="#i-star"/></svg>
      <svg class="star alt" style="--dx:-5.6;--dy:2.5;--mx:-2.7;--my:2.1;--s:.4;--t:1s"><use href="#i-star"/></svg>
      <svg class="star" style="--dx:-0.6;--dy:3.5;--mx:-1.1;--my:3.5;--s:.3;--t:1.8s"><use href="#i-star"/></svg>
      <svg class="star alt" style="--dx:3.0;--dy:-1.1;--mx:2.7;--my:-.4;--s:.3;--t:2.1s"><use href="#i-star"/></svg>
    </h1>
  </div>

  <!-- fixed 3D stage sits behind all content -->
  <div class="laptop-stage is-booting" id="stage" aria-hidden="true">
    <canvas id="laptop-canvas"></canvas>
    <svg class="laptop-fallback" viewBox="0 0 240 160" fill="none" stroke="#22e5ff" stroke-width="3">
      <rect x="40" y="12" width="160" height="104" rx="8" fill="#050a1a"/>
      <path d="M16 124h208l-14 20H30z" fill="#0f2a80"/>
      <path d="M60 40l14 12-14 12M84 64h30" stroke-linecap="square"/>
    </svg>
  </div>

  <main id="main">
    <section class="hero" id="hero">
      <div class="hero-copy">
        <p class="eyebrow glass-light" data-text="eyebrow"></p>
        <p class="tagline" data-text="tagline"></p>
        <div class="actions">
          <a class="btn btn-icon" data-link="github" target="_blank" rel="noopener"><svg class="icon"><use href="#i-github"/></svg><span class="sr-only">GitHub</span></a>
          <a class="btn btn-icon" data-link="email"><svg class="icon"><use href="#i-mail"/></svg><span class="sr-only">Email</span></a>
          <a class="btn btn-icon" data-link="instagram" target="_blank" rel="noopener"><svg class="icon"><use href="#i-insta"/></svg><span class="sr-only">Instagram</span></a>
        </div>
      </div>
    </section>

    <section class="section" id="about"></section>
    <section class="section" id="projects"></section>
    <section class="section" id="timeline"></section>
    <section class="section" id="quotes"></section>
    <section class="section" id="contact"></section>
  </main>

  <footer class="footer"><p data-text="footer"></p></footer>

  <!-- command palette -->
  <div class="palette" id="palette" hidden>
    <div class="palette-box glass" role="dialog" aria-modal="true" aria-label="Command palette">
      <label class="palette-input">
        <span class="prompt">uday@portfolio:~$</span>
        <input id="palette-q" type="text" autocomplete="off" spellcheck="false" placeholder="type a command" aria-controls="palette-list">
      </label>
      <ul id="palette-list" role="listbox"></ul>
      <p class="palette-hint">↑ ↓ to move · enter to run · esc to close</p>
    </div>
  </div>

  <noscript><p class="noscript">This site needs JavaScript. You can still reach Uday at <a href="mailto:uday.dot.offical@gmail.com">uday.dot.offical@gmail.com</a>.</p></noscript>

  <!-- Three.js (r128) and js/laptop.js are loaded by main.js on first interaction or after load + 6s -->
  <script defer src="js/content.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/fx.js"></script>
</body>
</html>
